<!doctype html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">


<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Obrigada! — Formatura Isadora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --c100: #EADDE6;
  --c200: #E0C9D9;
  --c300: #D1B0C8;
  --c500: #B884A9;
  --c600: #A86C97;
  --c800: #875479;
  --c900: #6F3E62;

  --bg: #F8F5F1;
  --bg-2: #F1EDE9;
  --ink: #2B1A4A;
  --ink-soft: #6E4AA0;

  --lav-100: var(--c100);
  --lav-300: var(--c200);
  --lav-500: var(--c600);
  --lav-600: var(--c900);

  --rule: rgba(111,62,98,0.18);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{
  font-family: 'Hind Siliguri', sans-serif;
  font-weight: 400;
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
a{color:inherit}

.label{
  font-family:'Hind Siliguri', sans-serif;
  font-weight:400;
  font-size:11px;
  letter-spacing:0.28em;
  text-transform:uppercase;
}

.page{
  max-width: 1200px;
  margin: 0 auto;
  padding: 36px 48px 90px;
  position: relative;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 64px;
}
.top .label{ color: var(--ink-soft) }
.top .mono{
  font-family:'Hind Siliguri', sans-serif;
  font-size:11px;
  letter-spacing:0.2em;
  text-transform:uppercase;
}
.top a{ text-decoration:none; }
.top .back{ color: var(--ink-soft); }
.top .back:hover{ color: var(--lav-600); }

/* =========== Hero =========== */
.thanks{
  text-align:center;
  padding: 20px 0 48px;
}
.thanks .mark{
  font-family:'Hind Siliguri', sans-serif;
  font-size:11px;
  letter-spacing:0.32em;
  text-transform:uppercase;
  color: var(--lav-600);
  margin-bottom: 26px;
}
.thanks h1{
  font-family:'Dancing Script', cursive;
  font-weight: 600;
  font-size: clamp(48px, 7vw, 96px);
  color: var(--ink);
  line-height: 0.95;
  margin-bottom: 22px;
}
.thanks .lede{
  font-family:'Hind Siliguri', sans-serif;
  font-style: italic;
  font-weight: 300;
  font-size: clamp(20px, 2.2vw, 26px);
  color: var(--ink-soft);
  max-width: 640px;
  margin: 0 auto;
  text-wrap: balance;
}
.thanks iframe{
  width: 100%;
  max-width: 640px;
  min-height: 600px;
  border: 0;
}

.rule{
  height:1px;
  background: var(--rule);
  position:relative;
  margin: 56px auto;
  max-width: 980px;
}
.rule::before,.rule::after{
  content:"";
  position:absolute;
  top:50%;
  width: 8px; height:8px;
  transform: translateY(-50%) rotate(45deg);
  background: var(--lav-500);
}
.rule::before{ left: 0 }
.rule::after{ right: 0 }

/* =========== Countdown =========== */
.countdown-wrap{
  text-align:center;
  padding: 16px 0 24px;
}
.countdown-wrap .label{ color: var(--lav-600); margin-bottom: 24px; }

.countdown{
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  max-width: 920px;
  margin: 0 auto;
  border: 1px solid var(--rule);
  border-radius: 2px;
  overflow: hidden;
  background: #fff;
  position: relative;
}
.countdown::before{
  content:"";
  position:absolute;
  inset: 10px;
  border: 1px solid var(--lav-300);
  pointer-events:none;
}
.cd-cell{
  padding: 36px 18px 30px;
  text-align:center;
  position:relative;
}
.cd-cell + .cd-cell{
  border-left: 1px solid var(--rule);
}
.cd-num{
  font-family:'Hind Siliguri', sans-serif;
  font-weight: 300;
  font-size: clamp(44px, 6.5vw, 88px);
  line-height: 1;
  color: var(--ink);
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.cd-label{
  font-family:'Hind Siliguri', sans-serif;
  font-size: 10px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-top: 14px;
}
.cd-foot{
  text-align:center;
  margin-top: 24px;
  font-family:'Hind Siliguri', sans-serif;
  font-style: italic;
  font-size: 18px;
  color: var(--ink-soft);
}
.cd-foot .script{
  font-family:'Dancing Script', cursive;
  font-style: normal;
  font-weight: 600;
  font-size: 26px;
  color: var(--lav-600);
}

.cd-live{
  display:inline-flex;
  align-items:center;
  gap: 8px;
  font-family:'Hind Siliguri', sans-serif;
  font-size: 10px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--lav-600);
}
.cd-live .dot{
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--lav-500);
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{opacity:.4;transform:scale(.8)} 50%{opacity:1;transform:scale(1.2)} }

/* =========== Cards =========== */
.cards{
  display:grid;
  grid-template-columns: 1fr;
  gap: 32px;
  padding: 20px 0 0;
  max-width: 980px;
  margin: 0 auto;
}

.card{
  background: var(--lav-100);
  border-radius: 2px;
  padding: 40px;
  position: relative;
  overflow: hidden;
}
.card::before{
  content:"";
  position:absolute;
  inset: 12px;
  border: 1px solid var(--lav-300);
  pointer-events:none;
}
.card .label{ color: var(--lav-600); margin-bottom: 14px; }
.card h2{
  font-family:'Dancing Script', cursive;
  font-weight: 600;
  font-size: 52px;
  line-height: 1;
  color: var(--ink);
  margin-bottom: 18px;
}
.card .body{
  font-family:'Hind Siliguri', sans-serif;
  font-size: 19px;
  line-height: 1.45;
  color: var(--ink-soft);
  margin-bottom: 24px;
}

/* Venue */
.venue-grid{
  display:grid;
  grid-template-columns: 1fr 1.1fr;
  gap: 40px;
  align-items:stretch;
  position: relative;
}
.venue-info{
  display:flex;
  flex-direction:column;
}
.venue-card .map{
  aspect-ratio: 4/5;
  min-height: 100%;
  border-radius: 2px;
  overflow: hidden;
  border: 1px solid var(--lav-300);
  background: var(--lav-100);
}
.venue-card .map iframe{
  width:100%; height:100%; border:0;
  filter: saturate(0.85) hue-rotate(-8deg) brightness(1.02);
}
.venue-card .row{
  display:flex; align-items:flex-start; gap: 14px;
  padding: 10px 0;
  border-top: 1px solid var(--rule);
}
.venue-card .row:first-of-type{ border-top: 0; }
.venue-card .row .ic{
  width: 22px; height: 22px; flex: none;
  color: var(--lav-600);
  display:grid; place-items:center;
  margin-top: 2px;
}
.venue-card .row .ic svg{ width: 18px; height: 18px; }
.venue-card .row .txt{
  font-family:'Hind Siliguri', sans-serif;
  font-size: 19px;
  line-height: 1.4;
  color: var(--ink);
}
.venue-card .row .txt strong{ font-weight: 500; }
.venue-card .links{
  margin-top: 22px;
  display:flex; gap: 18px; flex-wrap: wrap;
}
.venue-card .links a{
  font-family:'Hind Siliguri', sans-serif;
  font-size: 11px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--ink);
  text-decoration: none;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--ink);
}
.venue-card .links a:hover{ color: var(--lav-600); border-color: var(--lav-600); }

/* Calendar add */
.addcal{
  text-align:center;
  padding: 64px 0 24px;
}
.addcal .label{ color: var(--lav-600); margin-bottom: 16px; }
.addcal h3{
  font-family:'Dancing Script', cursive;
  font-weight: 600;
  font-size: clamp(30px, 3.8vw, 44px);
  color: var(--ink);
  margin-bottom: 22px;
}
.addcal .btns{ display:flex; justify-content:center; gap: 14px; flex-wrap:wrap; }
.cta{
  display:inline-flex;
  align-items:center;
  gap: 12px;
  padding: 16px 32px;
  background: var(--ink);
  color: var(--bg);
  font-family:'Hind Siliguri', sans-serif;
  font-size: 11px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  text-decoration: none;
  border-radius: 999px;
  transition: background .2s, transform .2s;
  border: 1px solid var(--ink);
}
.cta:hover{ background: var(--lav-600); border-color: var(--lav-600); transform: translateY(-2px); }
.cta.ghost{ background: transparent; color: var(--ink); }
.cta.ghost:hover{ background: var(--ink); color: var(--bg); }
.cta svg{ width: 12px; height: 12px; }

.foot{
  text-align:center;
  padding-top: 64px;
  border-top: 1px solid var(--rule);
  margin-top: 56px;
  color: var(--ink-soft);
}
.foot .sig{
  font-family:'Dancing Script', cursive;
  font-size: 30px;
  color: var(--lav-500);
  margin-bottom: 6px;
}
.foot .label{ color: var(--ink-soft); opacity: .7; }

/* Cookie consent */
.cookie-modal{
  position: fixed;
  inset: 0;
  z-index: 999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(43, 26, 74, 0.65);
  backdrop-filter: blur(4px);
}
.cookie-modal.visible{ display: flex; }
.cookie-card{
  width: min(100%, 480px);
  background: var(--bg);
  border: 1px solid var(--lav-300);
  border-radius: 16px;
  padding: 32px;
  box-shadow: 0 20px 60px rgba(43, 26, 74, 0.18);
  text-align: center;
}
.cookie-card .label{ margin-bottom: 12px; }
.cookie-card h2{
  font-family:'Dancing Script', cursive;
  font-size: 34px;
  color: var(--ink);
  margin-bottom: 12px;
}
.cookie-card p{ color: var(--ink-soft); margin-bottom: 20px; }
.cookie-card button{
  border: 0;
  background: var(--lav-600);
  color: #fff;
  padding: 12px 24px;
  border-radius: 999px;
  font-family:'Hind Siliguri', sans-serif;
  font-size: 12px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  cursor: pointer;
}
.cookie-card button:hover{ background: var(--ink); }

/* Confetti stars */
.confetti{
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.confetti svg{
  position:absolute;
  opacity: 0;
  animation: fall 6s linear forwards;
}
@keyframes fall{
  0%{ transform: translateY(-40px) rotate(0); opacity: 0; }
  10%{ opacity: .9; }
  100%{ transform: translateY(110vh) rotate(720deg); opacity: 0; }
}
.page{ position: relative; z-index: 1; }

@media (max-width: 860px){
  .page{ padding: 24px 20px 70px; }
  .top{ flex-direction: column; gap: 8px; align-items:flex-start; }
  .cards{ grid-template-columns: 1fr; }
  .card{ padding: 28px 22px; }
  .card h2{ font-size: 42px; }
  .venue-grid{ grid-template-columns: 1fr; gap: 24px; }
  .venue-card .map{ aspect-ratio: 16/11; min-height: 0; }
  .countdown{ grid-template-columns: repeat(2, 1fr); }
  .cd-cell + .cd-cell{ border-left: 0; }
  .cd-cell:nth-child(2){ border-left: 1px solid var(--rule); }
  .cd-cell:nth-child(3),.cd-cell:nth-child(4){ border-top: 1px solid var(--rule); }
  .cd-cell{ padding: 24px 10px 20px; }
}
</style>
</head>
<body>

<div id="cookieConsent" class="cookie-modal visible" role="dialog" aria-modal="true" aria-labelledby="cookieTitle">
  <div class="cookie-card">
    <p class="label">Privacidade</p>
    <h2 id="cookieTitle">Preciso da sua permissão para cookies</h2>
    <p>Para o formulário funcionar corretamente, preciso da sua permissão para utilizar cookies.</p>
    <button id="acceptCookies" type="button">Aceitar e continuar</button>
  </div>
</div>

<div class="confetti" aria-hidden="true"></div>

<div class="page">

  <header class="top">
    <div class="label">Formatura · Isadora Moreira de Borba</div>
    <a class="mono back" href="/">← Voltar ao convite</a>
  </header>

  <section class="thanks">
    <iframe id="gform" name="gform" data-src="https://docs.google.com/forms/d/e/1FAIpQLSexsxbKNn4gWcq1UnN9RyV5bBujS_oa-86b8lHtZ6-TrP8htw/viewform?embedded=true" src="about:blank" width="640" height="600" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
  </section>




</div>

<script>
(function(){
  const eventDate = new Date('2026-08-15T20:00:00-03:00');
  const elD = document.getElementById('cd-d');
  const elH = document.getElementById('cd-h');
  const elM = document.getElementById('cd-m');
  const elS = document.getElementById('cd-s');

  function pad(n){ return String(n).padStart(2,'0'); }

  function tick(){
    const now = new Date();
    let diff = Math.max(0, eventDate - now);
    const day = 1000*60*60*24;
    const hr  = 1000*60*60;
    const min = 1000*60;

    const d = Math.floor(diff / day); diff -= d*day;
    const h = Math.floor(diff / hr);  diff -= h*hr;
    const m = Math.floor(diff / min); diff -= m*min;
    const s = Math.floor(diff / 1000);
    elD.textContent = pad(d);
    elH.textContent = pad(h);
    elM.textContent = pad(m);
    elS.textContent = pad(s);
  }
  tick();
  setInterval(tick, 1000);

  function toG(date){
    return new Date(date).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  }
  const start = eventDate;
  const end = new Date(eventDate.getTime() + 4*60*60*1000);
  const title = encodeURIComponent('Formatura Isadora Moreira de Borba');
  const details = encodeURIComponent('Celebração de formatura em Design de Moda — Food Hall Bourbon Country.');
  const loc = encodeURIComponent('Food Hall Bourbon Country, Av. Túlio de Rose, 80, Passo dAreia, Porto Alegre - RS');
  const gcalUrl = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+title+'&dates='+toG(start)+'/'+toG(end)+'&details='+details+'&location='+loc;
  document.getElementById('gcalBtn').href = gcalUrl;

  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Isa Formatura//PT-BR',
    'BEGIN:VEVENT',
    'UID:formatura-isa-2026@isadoraborba',
    'DTSTAMP:'+toG(new Date()),
    'DTSTART:'+toG(start),
    'DTEND:'+toG(end),
    'SUMMARY:Formatura Isadora Moreira de Borba',
    'DESCRIPTION:Celebração de formatura em Design de Moda — Food Hall Bourbon Country.',
    'LOCATION:Food Hall Bourbon Country\\, Av. Túlio de Rose\\, 80\\, Passo dAreia\\, Porto Alegre - RS',
    'END:VEVENT',
    'END:VCALENDAR',
  ].join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar'});
  document.getElementById('icsBtn').href = URL.createObjectURL(blob);

  // Confetti stars on load
  const confetti = document.querySelector('.confetti');
  const starSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L14.2 9 L21.5 9.3 L15.6 13.6 L17.8 20.6 L12 16.3 L6.2 20.6 L8.4 13.6 L2.5 9.3 L9.8 9 Z"/></svg>';
  const tones = ['#D1B0C8','#B884A9','#A86C97','#EADDE6','#875479'];
  for (let i=0; i<22; i++){
    const s = document.createElement('div');
    s.innerHTML = starSvg;
    const el = s.firstChild;
    el.style.left = (Math.random()*100) + 'vw';
    el.style.top = (-40 - Math.random()*120) + 'px';
    el.style.animationDelay = (Math.random()*2.5) + 's';
    el.style.animationDuration = (5 + Math.random()*4) + 's';
    el.style.color = tones[i % tones.length];
    confetti.appendChild(el);
  }
})();
</script>
<script type="text/javascript">
let formLoadCount = 0;
let redirectEnabled = false;
const consentKey = 'formatura-cookie-consent';
const cookieModal = document.getElementById('cookieConsent');
const acceptBtn = document.getElementById('acceptCookies');
const gform = document.getElementById('gform');

function showCookieModal() {
  if (cookieModal) {
    cookieModal.classList.add('visible');
    cookieModal.setAttribute('aria-hidden', 'false');
  }
}

function hideCookieModal() {
  if (cookieModal) {
    cookieModal.classList.remove('visible');
    cookieModal.setAttribute('aria-hidden', 'true');
  }
}

function loadFormAfterConsent() {
  hideCookieModal();
  formLoadCount = 0;
  redirectEnabled = true;
  if (gform) {
    const src = gform.getAttribute('data-src');
    if (src && gform.getAttribute('src') !== src) {
      gform.setAttribute('src', src);
    }
  }
}

function cookiesEnabled() {
  try {
    const testKey = 'formatura-cookie-test';
    window.localStorage.setItem(testKey, '1');
    window.localStorage.removeItem(testKey);
    return true;
  } catch (error) {
    return false;
  }
}

try {
  const hasConsent = window.localStorage.getItem(consentKey) === 'accepted';
  if (cookiesEnabled()) {
    if (hasConsent) {
      loadFormAfterConsent();
    } else {
      showCookieModal();
    }
  } else {
    loadFormAfterConsent();
  }
} catch (error) {
  loadFormAfterConsent();
}

if (acceptBtn) {
  acceptBtn.addEventListener('click', function () {
    try {
      window.localStorage.setItem(consentKey, 'accepted');
    } catch (error) {}
    loadFormAfterConsent();
  });
}

if (gform) {
  gform.addEventListener('load', function () {
    formLoadCount++;
    if (redirectEnabled && formLoadCount > 1) {
      window.location.href = "{{ site.baseurl }}/obrigada/";
    }
  });
}
</script>
</body>
</html>
